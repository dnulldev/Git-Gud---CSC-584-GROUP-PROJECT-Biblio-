<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biblio-Space | Student Registration</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    body {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 55%, #4338ca 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow-x: hidden;
    }

    .split-wrapper {
      width: 100%;
      max-width: 1240px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 3rem;
    }

    .login-section {
      flex: 1.35;
      display: flex;
      justify-content: center;
    }

    .auth-card {
      background: #ffffff;
      width: 100%;
      max-width: 560px;
      border-radius: 14px;
      padding: 2.5rem 2.75rem;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.28);
      position: relative;
      z-index: 2;
    }

    .auth-header {
      margin-bottom: 1.35rem;
    }

    .brand-tag {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #4338ca;
      background: #eef2ff;
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      display: inline-block;
      margin-bottom: 0.6rem;
    }

    .auth-header h1 {
      color: #111827;
      font-size: 1.55rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .auth-header p {
      color: #6b7280;
      font-size: 0.88rem;
    }

    .two-col-inputs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .btn-indigo {
      background: #312e81;
      color: #ffffff;
      width: 100%;
    }

    .btn-indigo:hover {
      background: #1e1b4b;
    }

    .switch-link {
      margin-top: 1.25rem;
      text-align: center;
      font-size: 0.85rem;
      color: #6b7280;
    }

    .switch-link a {
      color: #312e81;
      font-weight: 600;
      text-decoration: none;
    }

    .switch-link a:hover {
      text-decoration: underline;
    }

    /* Right Side White Line-Shadow Library Animation */
    .library-art-section {
      flex: 1.1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      min-height: 440px;
      user-select: none;
    }

    .art-backdrop-ring {
      position: absolute;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      border: 1.5px dashed rgba(255, 255, 255, 0.16);
      animation: spinSlow 45s linear infinite;
    }

    .art-backdrop-ring-inner {
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 60px rgba(255, 255, 255, 0.08);
    }

    .library-svg {
      width: 100%;
      max-width: 420px;
      height: auto;
      filter: drop-shadow(0 12px 24px rgba(255, 255, 255, 0.14));
      z-index: 1;
    }

    .float-main { animation: floatBook 5s ease-in-out infinite; }
    .float-slow-1 { animation: floatGentle 6s ease-in-out infinite; }
    .float-slow-2 { animation: floatGentle 7s ease-in-out infinite reverse; }
    .page-flip { animation: pageTurn 3.5s ease-in-out infinite; transform-origin: 220px 235px; }
    .sparkle-1 { animation: pulseGlow 3s ease-in-out infinite; }
    .sparkle-2 { animation: pulseGlow 4s ease-in-out infinite 1.2s; }

    .art-caption {
      margin-top: 1rem;
      text-align: center;
      z-index: 1;
    }

    .art-caption h2 {
      font-size: 1.15rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 0.25rem;
    }

    .art-caption p {
      font-size: 0.88rem;
      color: rgba(255, 255, 255, 0.62);
    }

    @keyframes floatBook {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }

    @keyframes floatGentle {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }

    @keyframes pageTurn {
      0%, 100% { transform: scaleX(1); opacity: 0.85; }
      50% { transform: scaleX(0.35); opacity: 0.45; }
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.2; transform: scale(0.9); }
      50% { opacity: 0.85; transform: scale(1.15); }
    }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @media (max-width: 900px) {
      .split-wrapper { flex-direction: column; }
      .library-art-section { min-height: 260px; }
    }
  </style>
</head>
<body>

  <div class="split-wrapper">
    <!-- Left-Center Student Registration Card -->
    <div class="login-section">
      <div class="auth-card">
        <div class="auth-header">
          <span class="brand-tag">Biblio-Space</span>
          <h1>Create an account</h1>
          <p>Register as a student to reserve discussion rooms</p>
        </div>

        <div id="regAlert" class="alert alert-danger"></div>

        <!-- Maps directly to ERD Student Entity: StudID, Name, PhoneNum, Email, Course -->
        <form id="registerForm">
          <div class="two-col-inputs" style="margin-bottom: 0.85rem;">
            <div class="form-group">
              <label for="regStudId">Student ID</label>
              <input type="text" id="regStudId" placeholder="e.g. 20261001" required />
            </div>
            <div class="form-group">
              <label for="regCourse">Course</label>
              <input type="text" id="regCourse" placeholder="e.g. CS240" required />
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 0.85rem;">
            <label for="regName">Full Name</label>
            <input type="text" id="regName" placeholder="Enter your full name" required />
          </div>

          <div class="two-col-inputs" style="margin-bottom: 0.85rem;">
            <div class="form-group">
              <label for="regEmail">Email</label>
              <input type="email" id="regEmail" placeholder="name@email.com" required />
            </div>
            <div class="form-group">
              <label for="regPhone">Phone Number</label>
              <input type="text" id="regPhone" placeholder="012-3456789" required />
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 1.4rem;">
            <label for="regPassword">Password</label>
            <input type="password" id="regPassword" placeholder="Create a password" required />
          </div>

          <button type="submit" class="btn btn-indigo">Register Account</button>
        </form>

        <div class="switch-link">
          Already have an account? <a href="index.html">Sign in</a>
        </div>
      </div>
    </div>

    <!-- Right-Side White Line-Shadow Library Animation -->
    <div class="library-art-section">
      <div class="art-backdrop-ring"></div>
      <div class="art-backdrop-ring-inner"></div>

      <svg class="library-svg" viewBox="0 0 440 360" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="220" cy="312" rx="145" ry="12" fill="rgba(255,255,255,0.08)" />

        <g stroke="rgba(255,255,255,0.22)" stroke-width="1.6" stroke-linecap="round">
          <line x1="75" y1="295" x2="365" y2="295" />
          <rect x="92" y="225" width="16" height="70" rx="2" />
          <line x1="92" y1="238" x2="108" y2="238" />
          <rect x="112" y="235" width="14" height="60" rx="2" />
          <rect x="130" y="218" width="18" height="77" rx="2" transform="rotate(-6 130 295)" />
          <rect x="302" y="230" width="16" height="65" rx="2" />
          <rect x="322" y="220" width="18" height="75" rx="2" />
          <line x1="322" y1="235" x2="340" y2="235" />
          <line x1="322" y1="280" x2="340" y2="280" />
        </g>

        <g class="float-slow-1" stroke="rgba(255,255,255,0.45)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="78" y="82" width="54" height="38" rx="4" transform="rotate(-12 78 82)" />
          <line x1="86" y1="90" x2="122" y2="82" />
          <line x1="88" y1="100" x2="116" y2="94" />
        </g>

        <g class="float-slow-2" stroke="rgba(255,255,255,0.45)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M325 75 L355 88 L325 101 L295 88 Z" />
          <path d="M306 94 V108 C306 113 344 113 344 108 V94" />
          <line x1="355" y1="88" x2="355" y2="108" />
        </g>

        <g class="float-main">
          <path d="M220 155 C190 142 145 142 118 154 V246 C145 234 190 234 220 248 Z"
                fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.78)" stroke-width="2.2" stroke-linejoin="round" />
          <path d="M220 155 C250 142 295 142 322 154 V246 C295 234 250 234 220 248 Z"
                fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.78)" stroke-width="2.2" stroke-linejoin="round" />
          <path class="page-flip" d="M220 155 C246 138 282 138 306 149 V240 C282 229 246 229 220 248 Z"
                fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.55)" stroke-width="1.6" />
          <g stroke="rgba(255,255,255,0.45)" stroke-width="1.6" stroke-linecap="round">
            <path d="M138 172 Q172 166 202 174" />
            <path d="M138 188 Q172 182 202 190" />
            <path d="M138 204 Q172 198 202 206" />
            <path d="M138 220 Q165 215 190 220" />
          </g>
          <g stroke="rgba(255,255,255,0.45)" stroke-width="1.6" stroke-linecap="round">
            <path d="M238 174 Q268 166 302 172" />
            <path d="M238 190 Q268 182 302 188" />
            <path d="M238 206 Q268 198 302 204" />
            <path d="M250 220 Q275 215 302 220" />
          </g>
          <path d="M112 252 C145 240 190 242 220 255 C250 242 295 240 328 252"
                stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round" />
        </g>

        <g class="sparkle-1" stroke="rgba(255,255,255,0.75)" stroke-width="1.8" stroke-linecap="round">
          <line x1="220" y1="88" x2="220" y2="104" />
          <line x1="212" y1="96" x2="228" y2="96" />
        </g>
        <g class="sparkle-2" stroke="rgba(255,255,255,0.6)" stroke-width="1.6" stroke-linecap="round">
          <line x1="168" y1="112" x2="168" y2="122" />
          <line x1="163" y1="117" x2="173" y2="117" />
          <line x1="274" y1="114" x2="274" y2="124" />
          <line x1="269" y1="119" x2="279" y2="119" />
        </g>
      </svg>

      <div class="art-caption">
        <h2>Quiet Spaces. Smart Reservations.</h2>
        <p>Book discussion rooms and presentation labs in seconds.</p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const studId = document.getElementById('regStudId').value.trim();
      const course = document.getElementById('regCourse').value.trim();
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const phoneNum = document.getElementById('regPhone').value.trim();
      const password = document.getElementById('regPassword').value;

      const students = JSON.parse(localStorage.getItem('biblio_students')) || [];
      if (students.some(s => s.studId === studId)) {
        const alertBox = document.getElementById('regAlert');
        alertBox.textContent = 'This Student ID is already registered. Please sign in.';
        alertBox.style.display = 'block';
        return;
      }

      students.push({ studId, name, phoneNum, email, course, password });
      localStorage.setItem('biblio_students', JSON.stringify(students));

      // Redirect back to index.html with the new Student ID pre-filled
      window.location.href = 'index.html?registered=' + encodeURIComponent(studId);
    });
  </script>
</body>
</html>
