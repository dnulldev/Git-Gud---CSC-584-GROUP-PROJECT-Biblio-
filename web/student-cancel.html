<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biblio-Space | My Bookings &amp; Cancel</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="navbar-brand">
      <span>Biblio-Space</span>
    </div>
    <div class="nav-links">
      <a href="student-book.html">Book a Room</a>
      <a href="student-cancel.html" class="active">My Bookings &amp; Cancel</a>
      <a href="index.html" class="btn-logout">Logout</a>
    </div>
  </nav>

  <div class="container">
    <div id="cancelAlert" class="alert"></div>

    <div class="card">
      <div class="card-title">
        <span>My Room Reservations (Booking Records)</span>
        <span id="quotaSummary" class="badge-gold">Active Quota: 0 / 6 hrs</span>
      </div>

      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>BookID</th>
              <th>Room Name</th>
              <th>BookDate</th>
              <th>Time Slot</th>
              <th>Hours</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="bookingTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const MAX_WEEKLY_HOURS = 6;

    function getBookings() {
      return JSON.parse(localStorage.getItem('biblio_bookings')) || [];
    }

    function cancelBooking(bookId) {
      const confirmCancel = confirm(`Are you sure you want to cancel booking ${bookId}? Your weekly quota hours will be refunded.`);
      if (!confirmCancel) return;

      const bookings = getBookings().map(b => {
        if (b.bookId === bookId) {
          return { ...b, status: 'Cancelled' };
        }
        return b;
      });

      localStorage.setItem('biblio_bookings', JSON.stringify(bookings));

      const alertBox = document.getElementById('cancelAlert');
      alertBox.className = 'alert alert-success';
      alertBox.textContent = `Booking ${bookId} has been cancelled. Your weekly quota hours have been updated.`;
      alertBox.style.display = 'block';

      renderTable();
    }

    function renderTable() {
      const bookings = getBookings();
      const activeHours = bookings
        .filter(b => b.status === 'Confirmed')
        .reduce((sum, b) => sum + Number(b.hours), 0);

      document.getElementById('quotaSummary').textContent = `Active Quota: ${activeHours} / ${MAX_WEEKLY_HOURS} hrs`;

      const tbody = document.getElementById('bookingTableBody');
      if (bookings.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:#6b7280;">No bookings found.</td></tr>';
        return;
      }

      tbody.innerHTML = bookings.map(b => {
        const isConfirmed = b.status === 'Confirmed';
        return `
          <tr>
            <td><strong>${b.bookId}</strong></td>
            <td>${b.roomName}</td>
            <td>${b.bookDate}</td>
            <td>${b.startTime} - ${b.endTime}</td>
            <td>${b.hours} hr(s)</td>
            <td>
              <span class="status-pill ${isConfirmed ? 'status-confirmed' : 'status-cancelled'}">
                ${b.status}
              </span>
            </td>
            <td>
              ${isConfirmed
                ? `<button class="btn btn-danger" style="padding:0.4rem 0.85rem; font-size:0.85rem;" onclick="cancelBooking('${b.bookId}')">Cancel Booking</button>`
                : `<span style="color:#6b7280; font-size:0.85rem;">&mdash;</span>`
              }
            </td>
          </tr>
        `;
      }).join('');
    }

    renderTable();
  </script>
</body>
</html>
